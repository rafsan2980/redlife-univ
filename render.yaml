services:
  - type: web
    name: university-blood-donation-network
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
