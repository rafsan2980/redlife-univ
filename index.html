<!doctype html>
<html lang="en">
  <head>
    <script>
      // Safeguard window.fetch to prevent "Cannot set property fetch of #<Window> which has only a getter" errors
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: true,
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => { /* Silently absorb write attempts */ },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn("Could not patch window.fetch property descriptor:", err);
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Blood Donation Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
